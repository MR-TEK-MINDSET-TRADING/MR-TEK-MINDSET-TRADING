async function file(name,data){let ok=false;try{const d=window.claude&&await window.claude.use("downloads");if(d){await d.save({filename:name,data});ok=true}}catch(x){}

const rows=s.T.map(t=>[t.date,t.time,t.pair,t.side,t.entry,t.sl,t.tp,t.exit,t.lot,t.risk,t.riskpct,t.rr,t.pnl,res(t.pnl),t.strat,t.plan,t.emo,t.err,t.notes].map(q).join(";"));

function clean(d){let AS=(Array.isArray(d.accts)?d.accts:[]).slice(0,20).map(a=>({id:String(a.id||"").replace(/[^a-z0-9]/gi,"").slice(0,20),name:String(a.name||"Compte").slice(0,40),type:TYPES.includes(a.type)?a.type:"Autre",cap:Number.isFinite(+a.cap)&&+a.cap>=0?r2(+a.cap):1000})).filter((a,i,ar)=>a.id&&ar.findIndex(b=>b.id==a.id)==i);

const ids=new Set(AS.map(a=>a.id));
const T=(Array.isArray(d.trades)?d.trades:[]).slice(0,20000).map(t=>{const n=v=>Number.isFinite(+v)&&v!==null&&v!==""?+v:null,x=v=>String(v??"").slice(0,500);
const id=String(t.id||Date.now().toString(36)+Math.random().toString(36).slice(2,5)).replace(/[^a-z0-9]/gi,"").slice(0,20)||Date.now().toString(36);
const date=/^\d{4}-\d{2}-\d{2}$/.test(t.date)?t.date:null;if(!date||n(t.pnl)===null)return null;
return{id,acct:ids.has(t.acct)?t.acct:AS[0].id,date,time:/^\d{2}:\d{2}$/.test(t.time)?t.time:"00:00",pair:x(t.pair).toUpperCase().slice(0,20),market:x(t.market),side:t.side=="SELL"?"SELL":"BUY",tf:x(t.tf),entry:n(t.entry)>0?n(t.entry):null,sl:n(t.sl)>0?n(t.sl):null,tp:n(t.tp),exit:n(t.exit),lot:n(t.lot),risk:Math.max(0,n(t.risk)||0),riskpct:n(t.riskpct)||0,pnl:r2(n(t.pnl)),rr:Math.max(0,n(t.rr)||0),strat:x(t.strat),setup:x(t.setup),reason:x(t.reason),plan:["Oui","Non","Partiellement"].includes(t.plan)?t.plan:"Oui",emo:x(t.emo),err:x(t.err),notes:x(t.notes),beforeImage:typeof t.beforeImage==="string"&&t.beforeImage.startsWith("data:image/jpeg;base64,")&&t.beforeImage.length<900000?t.beforeImage:"",afterImage:typeof t.afterImage==="string"&&t.afterImage.startsWith("data:image/jpeg;base64,")&&t.afterImage.length<900000?t.afterImage:""}}).filter(Boolean);
const M=(Array.isArray(d.mind)?d.mind:[]).slice(0,5000).map(m=>({date:String(m.date||"").slice(0,10),type:m.type=="Hebdomadaire"?"Hebdomadaire":"Quotidien",disc:Math.min(10,Math.max(1,+m.disc||1)),emo:String(m.emo||"").slice(0,50),plan:String(m.plan||"").slice(0,20),err:String(m.err||"").slice(0,500),les:String(m.les||"").slice(0,500),goal:String(m.goal||"").slice(0,500)}));
return{set:{name:String(d.set?.name||"").slice(0,80)},accts:AS,cur:ids.has(d.cur)?d.cur:AS[0].id,ob:d.ob===true||T.length>0,trades:T,mind:M}}
function imp(fl){if(!fl)return;if(fl.size>5e6){MSG="Fichier trop volumineux.";MSGE=true;return render()}const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=="object"||!d.set||!Array.isArray(d.trades))throw 0;S=clean(d);save();MSG="Sauvegarde restaurée ("+S.trades.length+" trades).";render()}catch(x){MSG="Fichier invalide.";MSGE=true;render()}};r.readAsText(fl)}
async function resumeSession(){if(!A||!A.refresh_token||!navigator.onLine)return;try{if(A.expires_at-Date.now()/1000<900)await refresh();await api("/auth/v1/user");if(PEND)saveNow();}catch(err){SY="⚠ Connexion à rétablir — vos données locales sont conservées";const q=$("#sync"),q2=$("#sync2");if(q)q.textContent=SY;if(q2)q2.textContent=SY;}}

boot();
